[package]
name = "vaultguard-contract"
version = "1.0.0"
authors = ["VaultGuard Engineering"]
edition = "2021"
description = "VaultGuard Onchain Treasury Policy Enforcement, Ed25519 Attestation Verification, and Atomic Spending Reservation Smart Contract on NEAR"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.5.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"

[dev-dependencies]
near-sdk = { version = "5.5.0", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
